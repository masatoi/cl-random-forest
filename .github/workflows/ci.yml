name: CI

on: [push]

jobs:
  test:
    name: ${{ matrix.lisp }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Run every combination to completion; one broken target should not hide
      # the results of the others.
      fail-fast: false
      matrix:
        lisp: [sbcl-bin, ccl-bin]
        os: [ubuntu-latest, macOS-latest]
        exclude:
          # Roswell fails with "unable to use 'ccl-bin'" here -- macOS CCL
          # binaries are no longer distributed.
          - lisp: ccl-bin
            os: macOS-latest

    steps:
      - uses: actions/checkout@v1
      - name: Install Roswell
        env:
          LISP: ${{ matrix.lisp }}
        run: |
          curl -L https://raw.githubusercontent.com/roswell/roswell/master/scripts/install-for-ci.sh | sh
      - name: Install Rove and dependencies
        run: ros install rove lparallel trivial-garbage masatoi/cl-libsvm-format masatoi/cl-online-learning
      - name: Run tests
        run: |
          PATH="~/.roswell/bin:$PATH"
          rove cl-random-forest-test.asd
