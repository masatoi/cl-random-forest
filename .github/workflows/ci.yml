name: CI

on: [push]

jobs:
  test:
    name: ${{ matrix.lisp }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Run every combination to completion; one broken target should not hide
      # the results of the others.
      fail-fast: false
      matrix:
        lisp: [sbcl-bin, ccl-bin]
        os: [ubuntu-latest, macOS-latest]
        exclude:
          # Roswell fails with "unable to use 'ccl-bin'" here -- macOS CCL
          # binaries are no longer distributed.
          - lisp: ccl-bin
            os: macOS-latest

    steps:
      - uses: actions/checkout@v1
      - name: Install Roswell
        env:
          LISP: ${{ matrix.lisp }}
        run: |
          curl -L https://raw.githubusercontent.com/roswell/roswell/master/scripts/install-for-ci.sh | sh
      - name: Install Rove and dependencies
        run: ros install rove lparallel trivial-garbage masatoi/cl-libsvm-format masatoi/cl-online-learning
      # Use the project's own runner rather than rove's `rove <system>.asd` script.
      # That script mutes *standard-output* and routes rove's report through a
      # synonym-stream lookup that does not resolve the same way on CCL, so the
      # CCL job produced no output at all and its exit code was the only signal.
      - name: Run tests
        run: ./t/run-test.ros
